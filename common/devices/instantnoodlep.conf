# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

NAME="OnePlus 8 Pro (instantnoodlep)"
KIND=phone                      # phone | qemu
SOC="Qualcomm Snapdragon 865 (SM8250)"
# ro.product.device: LineageOS says OnePlus8Pro, OxygenOS instantnoodlep (the project is 19811, IN2023 is the EU model)
CODENAMES="instantnoodlep OnePlus8Pro"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=instantnoodlep
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/...
DTB=                            # empty: Mu-Silicium/Resources/DTBs/instantnoodlep.dtb (uefi/files: the three "kona ... SoC 19811" dtbs of the phone's boot_b; ABL picks by msm-id)
FD_BASE=0x9FC00000              # as the OnePlus 8: the same kona memory map (instantnoodlepPkg/Library/MemoryMapLib)
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # where the kernel + images container goes (/proc/iomem of this phone: Android's CMA pools only)

# --- kernel and loader -----------------------------------------------------------------------------
# platform_instantnoodlep in xnuloader/loader.c: the framebuffer is the OnePlus 8's address but 1080 x 2376.
FB_BASE=0x9C000000
WIFI_ATH11K=0                   # QCA6390 on PCIe, as the OnePlus 8
BOARD_ARGS=""

# --- what the run needs ----------------------------------------------------------------------------
# First bring-up: the framebuffer and the CPUs only (docs/PORTING.md: "start with no extras"). Touch (S6SY791), the
# panel's 120 Hz and the MDP push path, GPU, audio, haptics are added one by one, each checked on this phone. Never
# touchscreen=1 (redwood's Goodix driver; GPIO 68 -> CrashDump on the OnePlus phones).
BOOTARGS="cpus=8 bootcpu=7"
DEFAULT_SECS=600
USERLAND_VARS=""
FIRMWARE=""

# --- installed mode (dual boot from the flash, next to Android: docs/INSTALL.md) ------------------------------
# darwin is cut off the end of userdata (tools/userdata-carve.py --wipe: this phone's userdata is metadata-encrypted
# and the owner agreed to its erasure); Android stays on its slot (_b) and the menu offers it. The UEFI goes into the
# spare slot's boot (_a). The phone's own darwin (LBA, GUID) is in phones/<adb serial>.darwin (common/flash/darwinid.py).
# What an installed run uses: the RAM runs' hardware arguments that were seen to work on this phone (gpu, panel push
# and DCS, 60 Hz, audio, haptics, Wi-Fi, slider and keys), and the iOS volume and its HFS+ /private/var on darwin.
FLASH_BOOTARGS="cpus=8 bootcpu=7 haptic=5 gpu=1 fb_push=2 fb_dcs=1 fb_hz=60 adsp=1 sound=4 sound_amps=1 sound_below=96 wifi=1 \
ufs=2 root_apfs=ufs_darwin ufs_write=1 hk_data=1 var_data=hfs var_data_format=1 var_store=1 sb_delay=8"
FLASH_USERLAND_VARS="CRYPTEXES=flash FLASHBOOT=1 GL=1 REST=1 RC_JOBS=rc.jobs.installed"   # no diagnostics at every boot
